<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMTOPIA DASHBOARD</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- include bootstrap and custom css -->
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.75) !important;
      backdrop-filter: blur(6px);
    }

    .modal-backdrop+div {
      overflow: auto;
    }

    .modal-body,
    .content {
      padding: 0;
    }

    /* Card Box Design (Matching Reference Image in RED) */
    .modal-content {
      background: linear-gradient(165deg, #180606 0%, #100303 50%, #080101 100%) !important;
      border: 1px solid rgba(239, 68, 68, 0.4) !important;
      border-radius: 18px !important;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(220, 38, 38, 0.35) !important;
      overflow: hidden;
      color: #ffffff !important;
      max-width: 420px;
      margin: 0 auto;
    }

    .common-box {
      background: transparent !important;
      padding: 28px 24px !important;
    }

    /* Header Title with Layer Icon */
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .dashboard-header-icon {
      width: 26px;
      height: 26px;
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dashboard-header-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin: 0;
      text-transform: uppercase;
    }

    /* Input Field Labels */
    .input-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #9ca3af;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    /* Custom Input Group Container */
    .custom-input-group {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    .input-left-icon {
      position: absolute;
      left: 14px;
      color: #ef4444;
      font-size: 16px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-right-icon {
      position: absolute;
      right: 14px;
      color: #6b7280;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
      background: none;
      border: none;
      padding: 0;
    }

    .input-right-icon:hover {
      color: #ef4444;
    }

    .custom-input {
      width: 100% !important;
      background-color: rgba(26, 10, 10, 0.75) !important;
      border: 1px solid rgba(239, 68, 68, 0.25) !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      height: 48px !important;
      padding: 10px 42px 10px 42px !important;
      font-size: 14px !important;
      transition: all 0.25s ease !important;
    }

    .custom-input:focus {
      border-color: #ef4444 !important;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.45) !important;
      background-color: rgba(36, 12, 12, 0.9) !important;
      outline: none !important;
    }

    .custom-input::placeholder {
      color: #6b7280 !important;
      font-weight: 400;
    }

    /* Red Primary Log in Button */
    .btn-login-red {
      width: 100% !important;
      height: 48px !important;
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%) !important;
      border: 1px solid #f87171 !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      letter-spacing: 0.5px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4) !important;
      transition: all 0.25s ease !important;
      cursor: pointer !important;
      margin-bottom: 12px !important;
    }

    .btn-login-red:hover {
      background: linear-gradient(180deg, #f87171 0%, #ef4444 100%) !important;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6) !important;
      transform: translateY(-1px) !important;
    }

    .btn-login-red:active {
      transform: translateY(1px) !important;
    }

    /* Red Secondary Register Button */
    .btn-register-red {
      width: 100% !important;
      height: 48px !important;
      background: linear-gradient(180deg, rgba(220, 38, 38, 0.3) 0%, rgba(153, 27, 27, 0.3) 100%) !important;
      border: 1px solid rgba(239, 68, 68, 0.45) !important;
      border-radius: 10px !important;
      color: #fca5a5 !important;
      font-size: 15px !important;
      font-weight: 700 !important;
      letter-spacing: 0.5px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      transition: all 0.25s ease !important;
      cursor: pointer !important;
    }

    .btn-register-red:hover {
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.5) 0%, rgba(185, 28, 28, 0.5) 100%) !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.4) !important;
      transform: translateY(-1px) !important;
    }

    .btn-register-red:active {
      transform: translateY(1px) !important;
    }

    .section-title h2 {
      display: none !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body style="background-color: rgba(0,0,0,0.0);">
  <button type="button" class="btn btn-primary hidden" data-toggle="modal" id="modalButton" data-target="#modalShow"
    data-backdrop="static" data-keyboard="false"></button>
  <div class="content">
    <section class="common-box ">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="row">
              <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
                <div class="modal-dialog modal-dialog-centered" role="document">
                  <div class="modal-content">
                    <div class="modal-body">
                      <div class="content">
                        <section class="common-box ">
                          <div class="container" style="width: 100%;">
                            <!-- Header Matching Reference Image -->
                            <div class="dashboard-header">
                              <svg class="dashboard-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                                <polyline points="2 17 12 22 22 17"></polyline>
                                <polyline points="2 12 12 17 22 12"></polyline>
                              </svg>
                              <h1 class="dashboard-header-title">TAMTOPIA DASHBOARD</h1>
                            </div>

                            <form method="POST" id="loginForm" action="/player/growid/login/validate"
                              accept-charset="UTF-8" role="form" autocomplete="off">
                              <input name="_token" type="hidden" value="{{ data }}">

                              <!-- Growtopia Name Field -->
                              <label class="input-label" for="login-name">GROWTOPIA NAME</label>
                              <div class="custom-input-group">
                                <span class="input-left-icon">
                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                  </svg>
                                </span>
                                <input id="login-name" class="form-control custom-input" required="required"
                                  placeholder="Your Growtopia Name" name="growId" value="" type="text"
                                  pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
                              </div>

                              <!-- Password Field -->
                              <label class="input-label" for="password">PASSWORD</label>
                              <div class="custom-input-group">
                                <span class="input-left-icon">
                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                  </svg>
                                </span>
                                <input id="password" class="form-control custom-input" required="required"
                                  placeholder="Your Growtopia Password" name="password" type="password" value=""
                                  pattern="[A-Za-z0-9@._!\-]+"
                                  title="Only letters, numbers, and @ . _ ! - are allowed">
                                <button type="button" id="togglePasswordBtn" class="input-right-icon" title="Toggle password visibility">
                                  <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                  </svg>
                                </button>
                              </div>

                              <!-- Log in Button -->
                              <button type="submit" id="btnLogin" class="btn btn-login-red">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                                  <polyline points="10 17 15 12 10 7"></polyline>
                                  <line x1="15" y1="12" x2="3" y2="12"></line>
                                </svg>
                                Log in
                              </button>

                              <!-- Register Account Button -->
                              <button type="button" id="btnRegister" class="btn btn-register-red">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                  <circle cx="8.5" cy="7" r="4"></circle>
                                  <line x1="20" y1="8" x2="20" y2="14"></line>
                                  <line x1="17" y1="11" x2="23" y2="11"></line>
                                </svg>
                                Register Account
                              </button>
                            </form>
                          </div>
                        </section>
                      </div>

                      <script>
                        document.addEventListener('DOMContentLoaded', function () {
                          const loginForm = document.getElementById('loginForm');
                          const loginNameInput = document.getElementById('login-name');
                          const passwordInput = document.getElementById('password');
                          const btnRegister = document.getElementById('btnRegister');
                          const togglePasswordBtn = document.getElementById('togglePasswordBtn');
                          const eyeIcon = document.getElementById('eyeIcon');

                          // Sanitize inputs
                          if (loginNameInput) {
                            loginNameInput.addEventListener('input', function () {
                              this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
                            });
                          }

                          if (passwordInput) {
                            passwordInput.addEventListener('input', function () {
                              this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
                            });
                          }

                          // Password Visibility Toggle
                          if (togglePasswordBtn && passwordInput) {
                            togglePasswordBtn.addEventListener('click', function () {
                              const isPassword = passwordInput.type === 'password';
                              passwordInput.type = isPassword ? 'text' : 'password';
                              eyeIcon.setAttribute('stroke', isPassword ? '#ef4444' : 'currentColor');
                            });
                          }

                          // Register button click -> skip register form, enter ingame directly using user typed credentials
                          if (btnRegister) {
                            btnRegister.addEventListener('click', function () {
                              loginForm.submit();
                            });
                          }
                        });
                      </script>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
<!-- JQUERY LIBRARY -->
<script
  src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
<!-- boostrap javascript -->
<script
  src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
<script>
  let clicked = false;
  $("a").click(function () { if (clicked === false) { clicked = true; return true; } $(this).attr("onclick", "return false;"); });
  $('document').ready(function () {
    document.onkeydown = (e) => {
      if (e.key == 123) {
        e.preventDefault();
      }
      if (e.key == 'F12') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'I') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.key == 'I') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'C') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'J') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.key == 'U') {
        e.preventDefault();
      }
    };
    $('#modalButton').trigger('click');
    $('.close').on('click', function () {
      window.location = "https://login.growtopiagame.com/player/validate/close"
    });

    var observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        for (var i = 0; i < mutation.addedNodes.length; i++) {
          if (mutation.addedNodes[i].tagName == 'DIV') {
            var thediv = mutation.addedNodes[i];
            var sw = window.screen.width;
            if (sw < 667) {
              $(thediv).css({
                'transform': 'scale(0.75)',
                'transform-origin': '0 0',
                '-webkit-transform': 'scale(0.75)',
                '-webkit-transform-origin': '0 0',
                'overflow': 'auto'
              });
            }
          }
        }
      });
    });
    observer.observe(document.body, { attributes: false, childList: true, characterData: false });
  });
</script>

</html>
