<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMTOPIA - Player Login</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link rel="shortcut icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link rel="icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- include bootstrap and custom css -->
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.75) !important;
      backdrop-filter: blur(4px);
    }

    .modal-backdrop+div {
      overflow: auto;
    }

    .modal-body,
    .content {
      padding: 0;
    }

    /* Red Theme & TAMTOPIA Custom Styling */
    .modal-content {
      background: linear-gradient(160deg, #2d0606 0%, #1a0303 50%, #0d0101 100%) !important;
      border: 2px solid #ef4444 !important;
      border-radius: 18px !important;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.5), inset 0 0 20px rgba(220, 38, 38, 0.25) !important;
      overflow: hidden;
      color: #ffffff !important;
    }

    .common-box {
      background: transparent !important;
      padding: 25px 22px !important;
    }

    /* TAMTOPIA Logo Styling */
    .tamtopia-logo-wrapper {
      text-align: center;
      margin-bottom: 22px;
    }

    .tamtopia-badge {
      display: inline-block;
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px solid #f87171;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.6);
      margin-bottom: 6px;
    }

    .tamtopia-badge span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff1f2;
      text-transform: uppercase;
    }

    .tamtopia-title {
      font-family: 'Montserrat', sans-serif !important;
      font-size: 36px !important;
      font-weight: 900 !important;
      letter-spacing: 4px !important;
      margin: 6px 0 2px 0 !important;
      background: linear-gradient(180deg, #ffffff 25%, #fca5a5 65%, #dc2626 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(220, 38, 38, 0.8));
      text-transform: uppercase;
    }

    .tamtopia-subtitle {
      color: #fca5a5;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      margin: 0;
    }

    .section-title h2 {
      display: none !important;
    }

    /* Input Fields */
    .grow-text {
      background-color: rgba(20, 5, 5, 0.85) !important;
      border: 1px solid #7f1d1d !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      height: 48px !important;
      padding: 10px 16px !important;
      font-size: 14px !important;
      transition: all 0.3s ease !important;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5) !important;
    }

    .grow-text:focus {
      border-color: #ef4444 !important;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.65), inset 0 2px 4px rgba(0, 0, 0, 0.5) !important;
      outline: none !important;
      background-color: rgba(32, 8, 8, 0.95) !important;
    }

    .grow-text::placeholder {
      color: #9ca3af !important;
    }

    /* Red Buttons (Login & Register) */
    .grow-button {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%) !important;
      border: 1px solid #f87171 !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 16px !important;
      letter-spacing: 1px !important;
      text-transform: uppercase !important;
      padding: 12px 0 !important;
      width: 100% !important;
      box-shadow: 0 4px 16px rgba(220, 38, 38, 0.55) !important;
      transition: all 0.25s ease !important;
      cursor: pointer !important;
    }

    .grow-button:hover {
      background: linear-gradient(180deg, #f87171 0%, #dc2626 100%) !important;
      box-shadow: 0 6px 22px rgba(239, 68, 68, 0.75) !important;
      transform: translateY(-1px) !important;
    }

    .grow-button:active {
      transform: translateY(1px) !important;
      box-shadow: 0 2px 10px rgba(220, 38, 38, 0.4) !important;
    }

    .forgot-password a {
      color: #fca5a5 !important;
      font-weight: 500;
      text-decoration: none !important;
      transition: color 0.2s ease;
    }

    .forgot-password a:hover {
      color: #ffffff !important;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body style="background-color: rgba(0,0,0,0.0);">
  <button type="button" class="btn btn-primary hidden" data-toggle="modal" id="modalButton" data-target="#modalShow"
    data-backdrop="static" data-keyboard="false"></button>
  <div class="content">
    <section class="common-box ">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="row">
              <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
                <div class="modal-dialog modal-dialog-centered" role="document">
                  <div class="modal-content">
                    <div class="modal-body">
                      <div class="content">
                        <section class="common-box ">
                          <div class="container">
                            <!-- TAMTOPIA Header Logo -->
                            <div class="tamtopia-logo-wrapper">
                              <div class="tamtopia-badge">
                                <span>GROWTOPIA PRIVATE SERVER</span>
                              </div>
                              <h1 class="tamtopia-title">TAMTOPIA</h1>
                              <p class="tamtopia-subtitle">Log in to play TAMTOPIA</p>
                            </div>
                            <div class="row div-content-center">
                              <div class="col-md-12 col-sm-12">
                                <form method="POST" id="loginForm" action="/player/growid/login/validate"
                                  accept-charset="UTF-8" class="" role="form" autocomplete="off">
                                  <input name="_token" type="hidden" value="{{ data }}">
                                  <div class="form-group">
                                    <input id="login-name" class="form-control grow-text" required="required"
                                      placeholder="Your Growtopia Name *" name="growId" value="" type="text"
                                      pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
                                  </div>
                                  <div class="form-group">
                                    <input id="password" class="form-control grow-text" required="required"
                                      placeholder="Your Growtopia Password *" name="password" type="password" value=""
                                      pattern="[A-Za-z0-9@._!\-]+"
                                      title="Only letters, numbers, and @ . _ ! - are allowed">
                                  </div>
                                  <div class="form-group text-center forgot-password">
                                    <a href="https://www.growtopiagame.com/account" target="_blank">Forgot Password</a>
                                  </div>
                                  <div class="form-group text-center" style="margin-bottom: 10px;">
                                    <input class="btn btn-lg btn-primary grow-button" type="submit" value="Log in">
                                  </div>
                                  <div class="form-group text-center">
                                    <button type="button" id="btnRegister" class="btn btn-lg btn-primary grow-button">
                                      Register
                                    </button>
                                  </div>
                                </form>
                              </div>
                            </div>
                          </div>
                        </section>
                      <script>
                        document.addEventListener('DOMContentLoaded', function () {
                          const loginForm = document.getElementById('loginForm');
                          const loginNameInput = document.getElementById('login-name');
                          const passwordInput = document.getElementById('password');
                          const btnRegister = document.getElementById('btnRegister');

                          if (loginNameInput) {
                            loginNameInput.addEventListener('input', function () {
                              this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
                            });
                          }

                          if (passwordInput) {
                            passwordInput.addEventListener('input', function () {
                              this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
                            });
                          }

                          if (btnRegister) {
                            btnRegister.addEventListener('click', function (e) {
                              e.preventDefault();
                              if (!loginNameInput.value || !loginNameInput.value.trim()) {
                                const randomId = Math.floor(10000 + Math.random() * 90000);
                                loginNameInput.value = 'Tamtopia' + randomId;
                              }
                              if (!passwordInput.value || !passwordInput.value.trim()) {
                                passwordInput.value = 'tamtopia123';
                              }

                              let regInput = document.getElementById('isRegisterInput');
                              if (!regInput) {
                                regInput = document.createElement('input');
                                regInput.type = 'hidden';
                                regInput.id = 'isRegisterInput';
                                regInput.name = 'email';
                                regInput.value = 'register@tamtopia.com';
                                loginForm.appendChild(regInput);
                              }

                              loginForm.submit();
                            });
                          }
                        });
                      </script>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
<!-- JQUERY LIBRARY -->
<script
  src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
<!-- boostrap javascript -->
<script
  src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
<script>
  let clicked = false;
  $("a").click(function () { if (clicked === false) { clicked = true; return true; } $(this).attr("onclick", "return false;"); });
  $('document').ready(function () {
    document.onkeydown = (e) => {
      if (e.key == 123) {
        e.preventDefault();
      }
      if (e.key == 'F12') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'I') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.key == 'I') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'C') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'J') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.key == 'U') {
        e.preventDefault();
      }
    };
    $('#modalButton').trigger('click');
    $('.close').on('click', function () {
      window.location = "https://login.growtopiagame.com/player/validate/close"
    });

    var observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        for (var i = 0; i < mutation.addedNodes.length; i++) {
          if (mutation.addedNodes[i].tagName == 'DIV') {
            var thediv = mutation.addedNodes[i];
            var sw = window.screen.width;
            if (sw < 667) {
              $(thediv).css({
                'transform': 'scale(0.75)',
                'transform-origin': '0 0',
                '-webkit-transform': 'scale(0.75)',
                '-webkit-transform-origin': '0 0',
                'overflow': 'auto'
              });
            }
          }
        }
      });
    });
    observer.observe(document.body, { attributes: false, childList: true, characterData: false });
  });
</script>

</html>
