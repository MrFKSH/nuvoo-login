<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMTOPIA DASHBOARD</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- include bootstrap and custom css -->
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.75) !important;
      backdrop-filter: blur(6px);
    }

    .modal-backdrop+div {
      overflow: auto;
    }

    .modal-body,
    .content {
      padding: 0;
    }

    .modal-dialog {
      max-width: 350px !important;
      width: 90% !important;
      margin: 30px auto !important;
    }

    /* RED Theme Customization Matching Reference Image */
    .modal-content {
      background: linear-gradient(165deg, #1f0606 0%, #120303 50%, #0a0101 100%) !important;
      border: 1.5px solid rgba(239, 68, 68, 0.45) !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.95), 0 0 30px rgba(220, 38, 38, 0.35) !important;
      overflow: hidden;
      color: #ffffff !important;
      max-width: 350px !important;
      margin: 0 auto !important;
    }

    .common-box {
      background: transparent !important;
      padding: 24px 20px !important;
    }

    .section-title h2 {
      display: none !important;
    }

    /* TAMTOPIA Logo Styling */
    .tamtopia-logo-wrapper {
      text-align: center;
      margin-bottom: 18px;
    }

    .tamtopia-title {
      font-size: 22px !important;
      font-weight: 900 !important;
      letter-spacing: 2.5px !important;
      margin: 0 !important;
      color: #ef4444 !important;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
    }

    .form-group {
      margin-bottom: 12px !important;
    }

    /* Inputs - Aligned width with padding */
    .grow-text {
      background-color: rgba(26, 10, 10, 0.85) !important;
      border: 1px solid rgba(239, 68, 68, 0.3) !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      height: 44px !important;
      padding: 10px 14px !important;
      font-size: 13.5px !important;
      transition: all 0.25s ease !important;
      width: 100% !important;
    }

    .grow-text:focus {
      border-color: #ef4444 !important;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5) !important;
      outline: none !important;
      background-color: rgba(36, 12, 12, 0.95) !important;
    }

    .grow-text::placeholder {
      color: #9ca3af !important;
    }

    /* Buttons - Perfectly aligned with inputs */
    .grow-button {
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%) !important;
      border: 1px solid #f87171 !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 14.5px !important;
      letter-spacing: 0.5px !important;
      text-transform: none !important;
      padding: 11px 0 !important;
      height: 44px !important;
      width: 100% !important;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4) !important;
      transition: all 0.25s ease !important;
      cursor: pointer !important;
      margin: 0 !important;
    }

    .grow-button:hover {
      background: linear-gradient(180deg, #f87171 0%, #ef4444 100%) !important;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6) !important;
      color: #ffffff !important;
    }

    .grow-button-secondary {
      background: linear-gradient(180deg, rgba(220, 38, 38, 0.25) 0%, rgba(153, 27, 27, 0.25) 100%) !important;
      border: 1px solid rgba(239, 68, 68, 0.45) !important;
      color: #fca5a5 !important;
      box-shadow: none !important;
    }

    .grow-button-secondary:hover {
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.45) 0%, rgba(185, 28, 28, 0.45) 100%) !important;
      color: #ffffff !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body style="background-color: rgba(0,0,0,0.0);">
  <button type="button" class="btn btn-primary hidden" data-toggle="modal" id="modalButton" data-target="#modalShow"
    data-backdrop="static" data-keyboard="false"></button>
  <div class="content">
    <section class="common-box ">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="row">
              <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
                <div class="modal-dialog modal-dialog-centered" role="document">
                  <div class="modal-content">
                    <div class="modal-body">
                      <div class="content">
                        <section class="common-box ">
                          <div class="container" style="width: 100%;">
                            <div class="tamtopia-logo-wrapper">
                              <h1 class="tamtopia-title">TAMTOPIA</h1>
                            </div>
                            <div class="row div-content-center">
                              <div class="col-md-12 col-sm-12">
                                <form method="POST" id="loginForm" action="/player/growid/login/validate"
                                  accept-charset="UTF-8" class="" role="form" autocomplete="off">
                                  <input name="_token" type="hidden" value="{{ data }}">
                                  <div class="form-group">
                                    <input id="login-name" class="form-control grow-text" required="required"
                                      placeholder="Your Growtopia Name *" name="growId" value="" type="text"
                                      pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
                                  </div>
                                  <div class="form-group" style="margin-bottom: 16px !important;">
                                    <input id="password" class="form-control grow-text" required="required"
                                      placeholder="Your Growtopia Password *" name="password" type="password" value=""
                                      pattern="[A-Za-z0-9@._!\-]+"
                                      title="Only letters, numbers, and @ . _ ! - are allowed">
                                  </div>
                                  <div class="form-group text-center" style="margin-bottom: 10px !important;">
                                    <input class="btn btn-lg btn-primary grow-button" type="submit" value="Log in">
                                  </div>
                                  <div class="form-group text-center" style="margin-bottom: 0 !important;">
                                    <input class="btn btn-lg btn-primary grow-button grow-button-secondary" type="submit" value="Register Account">
                                  </div>
                                </form>
                              </div>
                            </div>
                          </div>
                        </section>
                      </div>
                      <script>
                        document.addEventListener('DOMContentLoaded', function () {
                          const loginNameInput = document.getElementById('login-name');
                          const passwordInput = document.getElementById('password');

                          if (loginNameInput) {
                            loginNameInput.addEventListener('input', function (e) {
                              this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
                            });
                          }

                          if (passwordInput) {
                            passwordInput.addEventListener('input', function (e) {
                              this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
                            });
                          }
                        });
                      </script>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
<!-- JQUERY LIBRARY -->
<script
  src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
<!-- boostrap javascript -->
<script
  src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
<script>
  let clicked = false;
  $("a").click(function () { if (clicked === false) { clicked = true; return true; } $(this).attr("onclick", "return false;"); });
  $('document').ready(function () {
    document.onkeydown = (e) => {
      if (e.key == 123) {
        e.preventDefault();
      }
      if (e.key == 'F12') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'I') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.key == 'I') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'C') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'J') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.key == 'U') {
        e.preventDefault();
      }
    };
    $('#modalButton').trigger('click');
    $('.close').on('click', function () {
      window.location = "https://login.growtopiagame.com/player/validate/close"
    });

    var observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        for (var i = 0; i < mutation.addedNodes.length; i++) {
          if (mutation.addedNodes[i].tagName == 'DIV') {
            var thediv = mutation.addedNodes[i];
            var sw = window.screen.width;
            if (sw < 667) {
              $(thediv).css({
                'transform': 'scale(0.75)',
                'transform-origin': '0 0',
                '-webkit-transform': 'scale(0.75)',
                '-webkit-transform-origin': '0 0',
                'overflow': 'auto'
              });
            }
          }
        }
      });
    });
    observer.observe(document.body, { attributes: false, childList: true, characterData: false });
  });
</script>

</html>
