<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growtopia Player Support - GTPS Dashboard</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link rel="shortcut icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link rel="icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  
  <style>
    /* Reset Viewport Container */
    html, body {
      background-color: transparent !important;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e2e8f0;
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .modal-backdrop {
      background-color: transparent !important;
      background: transparent !important;
      display: none !important;
    }

    /* Reset Growtopia & Bootstrap Offsets */
    .content, 
    .common-box, 
    .container, 
    .row, 
    .col-md-12, 
    .col-sm-12, 
    .modal, 
    .modal-body {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
    }

    .modal {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      opacity: 1 !important;
      max-height: 100vh !important;
    }

    .modal-dialog {
      width: 92% !important;
      max-width: 390px !important;
      margin: 0 auto !important;
      position: relative !important;
      top: auto !important;
    }

    .hidden {
      display: none !important;
    }

    /* THE CARD - Glassmorphism Semi-Transparent Red Theme */
    .modal-content {
      background: rgba(16, 6, 9, 0.82) !important; /* Slightly transparent dark backdrop */
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1.5px solid rgba(255, 45, 65, 0.45) !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 22px rgba(255, 30, 50, 0.25) !important;
      padding: 14px 20px !important;
      width: 100% !important;
      max-height: 94vh !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      box-sizing: border-box !important;
    }

    /* Custom Sleek Scrollbar */
    .modal-content::-webkit-scrollbar {
      width: 4px;
    }
    .modal-content::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }
    .modal-content::-webkit-scrollbar-thumb {
      background: rgba(255, 42, 61, 0.5);
      border-radius: 4px;
    }

    /* Header Title (Mentok Atas) */
    .section-title {
      margin: 0 0 12px 0 !important;
      padding: 0 !important;
      text-align: center !important;
      display: block !important;
    }

    .section-title h2 {
      color: #ffffff !important;
      font-size: 14.5px !important;
      font-weight: 700 !important;
      letter-spacing: 1.2px !important;
      text-transform: uppercase !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.2 !important;
    }
    .section-title h2 svg {
      color: #ff2a3d !important;
      width: 18px !important;
      height: 18px !important;
      flex-shrink: 0;
    }

    /* Input Field Labels */
    .field-label {
      font-size: 9.5px !important;
      font-weight: 700 !important;
      color: #a85c63 !important;
      letter-spacing: 0.8px !important;
      text-transform: uppercase !important;
      margin-bottom: 3px !important;
      display: block !important;
    }

    /* Form Groups */
    .form-group {
      margin-bottom: 9px !important;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 12px;
      color: #ff2a3d;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .input-icon-right {
      position: absolute;
      right: 12px;
      color: #ff2a3d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .input-icon-right:hover {
      opacity: 1;
    }

    /* Inputs */
    .grow-text, .form-control {
      width: 100% !important;
      background-color: rgba(26, 10, 13, 0.75) !important; /* Semi-transparent inputs */
      border: 1px solid rgba(115, 35, 45, 0.6) !important;
      border-radius: 8px !important;
      color: #ffffff !important;
      height: 36px !important;
      padding-left: 36px !important;
      padding-right: 36px !important;
      font-size: 12px !important;
      box-shadow: none !important;
      transition: all 0.2s ease !important;
      box-sizing: border-box !important;
    }
    .grow-text::placeholder, .form-control::placeholder {
      color: #7a3d44 !important;
    }
    .grow-text:focus, .form-control:focus {
      background-color: rgba(35, 12, 16, 0.9) !important;
      border-color: #ff2a3d !important;
      box-shadow: 0 0 10px rgba(255, 42, 61, 0.35) !important;
      outline: none !important;
    }

    /* Action Buttons */
    .grow-button, .btn-primary {
      width: 100% !important;
      height: 36px !important;
      border-radius: 8px !important;
      font-weight: 600 !important;
      font-size: 12.5px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 6px !important;
      border: none !important;
      transition: all 0.2s ease !important;
      cursor: pointer !important;
      text-decoration: none !important;
      box-sizing: border-box !important;
    }

    /* Log in Button */
    input[type="submit"].grow-button, #loginSubmitBtn {
      background: linear-gradient(90deg, rgba(217, 4, 41, 0.9) 0%, rgba(255, 46, 77, 0.9) 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 3px 12px rgba(255, 30, 60, 0.35) !important;
      margin-top: 3px !important;
    }
    input[type="submit"].grow-button:hover, #loginSubmitBtn:hover {
      background: linear-gradient(90deg, #b80322 0%, #e62240 100%) !important;
      box-shadow: 0 5px 16px rgba(255, 30, 60, 0.5) !important;
    }

    /* Register Account Button */
    .grow-button-blue, #toggleRegister {
      background: rgba(60, 15, 22, 0.55) !important;
      border: 1.5px solid rgba(255, 42, 61, 0.45) !important;
      color: #ff6677 !important;
      margin-top: 0px !important;
    }
    .grow-button-blue:hover, #toggleRegister:hover {
      background: rgba(80, 20, 30, 0.8) !important;
      border-color: #ff2a3d !important;
      color: #ff8899 !important;
    }

    #toggleLogin {
      color: #ff6677 !important;
      text-decoration: none !important;
      font-size: 12px;
      font-weight: 500;
      transition: color 0.2s;
    }
    #toggleLogin:hover {
      color: #ff8899 !important;
      text-decoration: underline !important;
    }

    /* Mentok Bawah */
    .forgot-password {
      margin-bottom: 0px !important;
      margin-top: 5px !important;
    }
  </style>
</head>
<body style="background-color: rgba(0,0,0,0.0);">

    data-backdrop="static" data-keyboard="false" style="display:none !important; opacity:0; pointer-events:none;"></button>

  <div class="content">
    <section class="common-box">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
              <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                  <div class="modal-body">
                    
                    <!-- HEADER TITLE WITH 3-LAYER STACK ICON -->
                    <div class="section-title center-align">
                      <h2>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

                          <path d="m22 12.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 12.5"/>
                          <path d="m22 17.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 17.5"/>

                        <span id="headerTitle">GTPS DASHBOARD</span>
                      </h2>
                    </div>

                      accept-charset="UTF-8" role="form" autocomplete="off">

                      <div class="form-group">
                        <label class="field-label" for="login-name">GROWTOPIA NAME</label>
                        <div class="input-wrapper">
                          <span class="input-icon-left">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                              <circle cx="12" cy="7" r="4"/>
                            </svg>
                          </span>
                          <input id="login-name" class="form-control grow-text" required="required"
                            placeholder="Your Growtopia Name" name="growId" value="" type="text"
                            pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
                        </div>
                      </div>

                      <div class="form-group">
                        <label class="field-label" for="password">PASSWORD</label>
                        <div class="input-wrapper">
                          <span class="input-icon-left">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                          </span>
                          <input id="password" class="form-control grow-text" required="required"
                            placeholder="Your Growtopia Password" name="password" type="password" value=""

                              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                              <circle cx="12" cy="12" r="3"/>
                            </svg>
                          </span>
                        </div>
                      </div>

                      <div class="form-group text-center">
                        <button class="btn btn-lg btn-primary grow-button" type="submit" id="loginSubmitBtn">

                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" x2="3" y1="12" y2="12"/>
                          </svg>
                          Log in
                        </button>
                      </div>

                      <div class="form-group text-center forgot-password">
                        <a href="#" id="toggleRegister" class="btn btn-lg btn-primary grow-button grow-button-blue">
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <line x1="19" x2="19" y1="8" y2="14"/>
                            <line x1="16" x2="22" y1="11" y2="11"/>
                          </svg>
                          Register Account
                        </a>
                      </div>

                    <!-- REGISTER FORM -->
                    <form method="POST" id="registerForm" action="/player/growid/login/validate"
                      accept-charset="UTF-8" class="hidden" role="form" autocomplete="off">
                      <input name="_token" type="hidden" value="{{ data }}">
                      
                      <div class="form-group">
                        <label class="field-label" for="register-name">GROWTOPIA NAME</label>
                        <div class="input-wrapper">
                          <span class="input-icon-left">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                              <circle cx="12" cy="7" r="4"/>
                            </svg>
                          </span>
                          <input id="register-name" class="form-control grow-text" required="required"
                            placeholder="Your Growtopia Name *" name="growId" value="" type="text"
                            pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">

                      </div>

                      <div class="form-group">
                        <label class="field-label" for="register-email">EMAIL ADDRESS</label>

                        <label class="field-label" for="register-password">PASSWORD</label>

                              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                          </span>

                            placeholder="Your Password *" name="password" type="password" value=""

                      </div>

                      <div class="form-group">
                        <label class="field-label" for="register-confirm-password">CONFIRM PASSWORD</label>

                              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>

                      </div>

                      <div class="form-group text-center">
                        <button class="btn btn-lg btn-primary grow-button" type="submit" id="registerSubmitBtn">
                          Register

                      <div class="form-group text-center">
                        <a href="#" id="toggleLogin" style="margin-top: 4px; display: inline-block;">Back to Login</a>
                      </div>
                    </form>

                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const toggleRegister = document.getElementById('toggleRegister');
      const toggleLogin = document.getElementById('toggleLogin');
      const headerTitle = document.getElementById('headerTitle');
      const loginSubmitButton = document.getElementById('loginSubmitBtn') || loginForm.querySelector('button[type="submit"], input[type="submit"]');
      const loginNameInput = document.getElementById('login-name');
      const passwordInput = document.getElementById('password');

      // Password visibility toggle feature
      const togglePasswordVisibility = document.getElementById('togglePasswordVisibility');
      if (togglePasswordVisibility && passwordInput) {
        togglePasswordVisibility.addEventListener('click', function () {
          if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.style.color = '#ffffff';
          } else {
            passwordInput.type = 'password';
            this.style.color = '#ff2a3d';
          }
        });
      }

      let registerAutoSubmitting = false;

      const buildAutoRegisterForm = () => {
        const tokenInput = loginForm.querySelector('input[name="_token"]');
        const tokenValue = tokenInput ? tokenInput.value : '';

        const autoForm = document.createElement('form');
        autoForm.method = 'POST';
        autoForm.action = '/player/growid/login/validate';
        autoForm.acceptCharset = 'UTF-8';
        autoForm.autocomplete = 'off';
        autoForm.style.display = 'none';

        autoForm.innerHTML = `
          <input name="_token" type="hidden" value="${tokenValue}">
          <input name="growId" type="hidden" value="">
          <input name="password" type="hidden" value="">
          <input name="email" type="hidden" value="">
          <input name="password_confirmation" type="hidden" value="">
        `;

        document.body.appendChild(autoForm);
        return autoForm;
      };

      toggleRegister.addEventListener('click', function (e) {
        e.preventDefault();
        if (registerAutoSubmitting) return;

        registerAutoSubmitting = true;
        if (headerTitle) headerTitle.textContent = 'REGISTERING...';
        loginForm.classList.add('hidden');
        registerForm.classList.add('hidden');

        const autoForm = buildAutoRegisterForm();
        autoForm.submit();
      });

      toggleLogin.addEventListener('click', function (e) {
        e.preventDefault();
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        if (headerTitle) headerTitle.textContent = 'GTPS DASHBOARD';
      });

      loginNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      passwordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
      });

      loginForm.addEventListener('submit', function (e) {
        if (loginSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }
        loginSubmitButton.disabled = true;
        if (loginSubmitButton.tagName === 'INPUT') {
          loginSubmitButton.value = 'Logging in...';
        } else {
          loginSubmitButton.innerHTML = 'Logging in...';
        }
      });

      const registerSubmitButton = document.getElementById('registerSubmitBtn') || registerForm.querySelector('button[type="submit"], input[type="submit"]');
      const registerNameInput = document.getElementById('register-name');
      const registerPasswordInput = document.getElementById('register-password');
      const registerConfirmPasswordInput = document.getElementById('register-confirm-password');

      if (registerNameInput) {
        registerNameInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
        });
      }

      if (registerPasswordInput) {
        registerPasswordInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
        });
      }

      if (registerConfirmPasswordInput) {
        registerConfirmPasswordInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
        });
      }

      if (registerForm) {
        registerForm.addEventListener('submit', function (e) {
          if (registerAutoSubmitting) return;

          if (registerSubmitButton && registerSubmitButton.disabled) {
            e.preventDefault();
            return false;
          }

          if (
            registerPasswordInput &&
            registerConfirmPasswordInput &&
            registerPasswordInput.value !== registerConfirmPasswordInput.value
          ) {
            e.preventDefault();
            alert('Passwords do not match!');
            return false;
          }

          if (registerSubmitButton) {
            registerSubmitButton.disabled = true;
            if (registerSubmitButton.tagName === 'INPUT') {
              registerSubmitButton.value = 'Registering...';
            } else {
              registerSubmitButton.innerHTML = 'Registering...';
            }
          }
        });
      }
    });
  </script>

  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
  <script>
    let clicked = false;
    $("a").click(function () {
      if (clicked === false) { clicked = true; return true; }
      $(this).attr("onclick", "return false;");
    });

    $(document).ready(function () {
      document.onkeydown = (e) => {
        if (e.key == 123) e.preventDefault();
        if (e.key == 'F12') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'I') e.preventDefault();
        if (e.ctrlKey && e.key == 'I') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'C') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'J') e.preventDefault();
        if (e.ctrlKey && e.key == 'U') e.preventDefault();
      };

      if ($('#modalButton').length) {
        $('#modalButton').trigger('click');
      }

      $('.close').on('click', function () {
        window.location = "https://login.growtopiagame.com/player/validate/close";
      });

      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          for (var i = 0; i < mutation.addedNodes.length; i++) {
            if (mutation.addedNodes[i].tagName == 'DIV') {
              var thediv = mutation.addedNodes[i];
              var sw = window.screen.width;
              if (sw < 667) {
                $(thediv).css({
                  'transform': 'scale(0.75)',
                  'transform-origin': '0 0',
                  '-webkit-transform': 'scale(0.75)',
                  '-webkit-transform-origin': '0 0',
                  'overflow': 'auto'
                });
              }
            }
          }
        });
      });
      observer.observe(document.body, { attributes: false, childList: true, characterData: false });
    });
  </script>
