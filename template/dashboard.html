<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growtopia Player Support - Survival Dashboard</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link rel="shortcut icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link rel="icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  
  <style>
    /* Reset & Custom Survival Dashboard Theme (Red Accent) */
    html, body {
      background-color: transparent !important;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e2e8f0;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100% !important;
    }

    .modal-backdrop {
      background-color: transparent !important;
      background: transparent !important;
      display: none !important;
    }

    /* Force Modal to Display Directly & Centered without Truncation */
    .content {
      padding: 0 !important;
      margin: 0 !important;
      background: transparent !important;
    }

    .modal {
      position: relative !important;
      top: auto !important;
      right: auto !important;
      bottom: auto !important;
      left: auto !important;
      z-index: 1050 !important;
      display: block !important;
      opacity: 1 !important;
      width: 100% !important;
      padding: 10px 0 !important;
    }

    .modal-dialog {
      max-width: 380px !important;
      width: 90% !important;
      margin: 15px auto !important;
    }

    /* Card Box Styling */
    .modal-content {
      background: linear-gradient(180deg, #18090b 0%, #0d0406 100%) !important;
      border: 1.5px solid rgba(255, 40, 60, 0.5) !important;
      border-radius: 18px !important;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85), 0 0 22px rgba(255, 30, 50, 0.25) !important;
      padding: 20px 20px !important;
      overflow: visible !important;
    }

    /* Reset Growtopia default orange lines and headers */
    .common-box, 
    .section-title::before, 
    .section-title::after,
    .modal-header,
    .modal-content::before,
    .modal-content::after,
    .container::before,
    .container::after {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* Title Styling - PROMINENT & VISIBLE */
    .section-title {
      margin: 0 0 18px 0 !important;
      padding: 0 !important;
      text-align: center !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .section-title h2 {
      color: #ffffff !important;
      font-size: 16px !important;
      font-weight: 700 !important;
      letter-spacing: 1.2px !important;
      text-transform: uppercase !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 10px !important;
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.4 !important;
    }
    .section-title h2 svg {
      color: #ff3344 !important;
      width: 20px !important;
      height: 20px !important;
      flex-shrink: 0;
    }

    /* Labels */
    .field-label {
      font-size: 10.5px !important;
      font-weight: 700 !important;
      color: #b86b72 !important;
      letter-spacing: 0.9px !important;
      text-transform: uppercase !important;
      margin-bottom: 5px !important;
      display: block !important;
    }

    /* Form Fields & Wrappers */
    .form-group {
      margin-bottom: 14px !important;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon-left {
      position: absolute;
      left: 12px;
      color: #ff3344;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .input-icon-right {
      position: absolute;
      right: 12px;
      color: #ff3344;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .input-icon-right:hover {
      opacity: 1;
    }

    /* Input Controls */
    .grow-text, .form-control {
      width: 100% !important;
      background-color: rgba(35, 12, 16, 0.85) !important;
      border: 1px solid rgba(115, 40, 50, 0.6) !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      height: 42px !important;
      padding-left: 38px !important;
      padding-right: 38px !important;
      font-size: 13px !important;
      box-shadow: none !important;
      transition: all 0.2s ease !important;
    }
    .grow-text::placeholder, .form-control::placeholder {
      color: #7a4249 !important;
    }
    .grow-text:focus, .form-control:focus {
      background-color: rgba(45, 14, 19, 0.95) !important;
      border-color: #ff3344 !important;
      box-shadow: 0 0 10px rgba(255, 51, 68, 0.35) !important;
      outline: none !important;
    }

    /* Action Buttons */
    .grow-button, .btn-primary {
      width: 100% !important;
      height: 42px !important;
      border-radius: 10px !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      border: none !important;
      transition: all 0.2s ease !important;
      cursor: pointer !important;
      text-decoration: none !important;
    }

    /* Submit Login Button */
    input[type="submit"].grow-button, #loginSubmitBtn {
      background: linear-gradient(90deg, #d90429 0%, #ff2e4d 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(255, 30, 60, 0.35) !important;
      margin-top: 4px !important;
    }
    input[type="submit"].grow-button:hover, #loginSubmitBtn:hover {
      background: linear-gradient(90deg, #b80322 0%, #e62240 100%) !important;
      box-shadow: 0 5px 18px rgba(255, 30, 60, 0.5) !important;
    }

    /* Secondary Register Button */
    .grow-button-blue, #toggleRegister {
      background: rgba(70, 18, 25, 0.6) !important;
      border: 1.5px solid rgba(255, 51, 68, 0.4) !important;
      color: #ff6677 !important;
      margin-top: 0px !important;
    }
    .grow-button-blue:hover, #toggleRegister:hover {
      background: rgba(90, 22, 32, 0.85) !important;
      border-color: #ff3344 !important;
      color: #ff8899 !important;
    }

    #toggleLogin {
      color: #ff6677 !important;
      text-decoration: none !important;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }

    #toggleLogin:hover {
      color: #ff8899 !important;
      text-decoration: underline !important;
    }

    .forgot-password {
      margin-bottom: 0px !important;
      margin-top: 8px !important;
    }
  </style>
</head>
<body style="background-color: rgba(0,0,0,0.0);">
  <div class="content">
    <section class="common-box">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="row">
              <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
                <div class="modal-dialog modal-dialog-centered" role="document">
                  <div class="modal-content">
                    <div class="modal-body">
                      
                      <!-- HEADER TITLE WITH ICON -->
                      <div class="section-title center-align">
                        <h2>
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>
                            <path d="m22 12.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 12.5"/>
                            <path d="m22 17.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 17.5"/>
                          </svg>
                          <span id="headerTitle">SURVIVAL DASHBOARD</span>
                        </h2>
                      </div>

                      <div class="row div-content-center">
                        <div class="col-md-12 col-sm-12">

                          <!-- LOGIN FORM -->
                          <form method="POST" id="loginForm" action="/player/growid/login/validate"
                            accept-charset="UTF-8" role="form" autocomplete="off">
                            <input name="_token" type="hidden" value="{{ data }}">
                            
                            <div class="form-group">
                              <label class="field-label" for="login-name">GROWTOPIA NAME</label>
                              <div class="input-wrapper">
                                <span class="input-icon-left">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                  </svg>
                                </span>
                                <input id="login-name" class="form-control grow-text" required="required"
                                  placeholder="Your Growtopia Name" name="growId" value="" type="text"
                                  pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
                              </div>
                            </div>

                            <div class="form-group">
                              <label class="field-label" for="password">PASSWORD</label>
                              <div class="input-wrapper">
                                <span class="input-icon-left">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                  </svg>
                                </span>
                                <input id="password" class="form-control grow-text" required="required"
                                  placeholder="Your Growtopia Password" name="password" type="password" value=""
                                  pattern="[A-Za-z0-9@._!\-#$]+"
                                  title="Only letters, numbers, and @ . _ ! - # $ are allowed">
                                <span class="input-icon-right" id="togglePasswordVisibility" title="Toggle password visibility">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                  </svg>
                                </span>
                              </div>
                            </div>

                            <div class="form-group text-center">
                              <button class="btn btn-lg btn-primary grow-button" type="submit" id="loginSubmitBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                                  <polyline points="10 17 15 12 10 7"/>
                                  <line x1="15" x2="3" y1="12" y2="12"/>
                                </svg>
                                Log in
                              </button>
                            </div>

                            <div class="form-group text-center forgot-password">
                              <a href="#" id="toggleRegister" class="btn btn-lg btn-primary grow-button grow-button-blue">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                                  <circle cx="9" cy="7" r="4"/>
                                  <line x1="19" x2="19" y1="8" y2="14"/>
                                  <line x1="16" x2="22" y1="11" y2="11"/>
                                </svg>
                                Register Account
                              </a>
                            </div>
                          </form>

                          <!-- REGISTER FORM -->
                          <form method="POST" id="registerForm" action="/player/growid/login/validate"
                            accept-charset="UTF-8" class="hidden" role="form" autocomplete="off">
                            <input name="_token" type="hidden" value="{{ data }}">
                            
                            <div class="form-group">
                              <label class="field-label" for="register-name">GROWTOPIA NAME</label>
                              <div class="input-wrapper">
                                <span class="input-icon-left">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                  </svg>
                                </span>
                                <input id="register-name" class="form-control grow-text" required="required"
                                  placeholder="Your Growtopia Name *" name="growId" value="" type="text"
                                  pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
                              </div>
                            </div>

                            <div class="form-group">
                              <label class="field-label" for="register-email">EMAIL ADDRESS</label>
                              <div class="input-wrapper">
                                <span class="input-icon-left">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                  </svg>
                                </span>
                                <input id="register-email" class="form-control grow-text" required="required"
                                  placeholder="Your Email *" name="email" value="" type="email">
                              </div>
                            </div>

                            <div class="form-group">
                              <label class="field-label" for="register-password">PASSWORD</label>
                              <div class="input-wrapper">
                                <span class="input-icon-left">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                  </svg>
                                </span>
                                <input id="register-password" class="form-control grow-text" required="required"
                                  placeholder="Your Password *" name="password" type="password" value=""
                                  pattern="[A-Za-z0-9@._!\-#$]+"
                                  title="Only letters, numbers, and @ . _ ! - # $ are allowed">
                              </div>
                            </div>

                            <div class="form-group">
                              <label class="field-label" for="register-confirm-password">CONFIRM PASSWORD</label>
                              <div class="input-wrapper">
                                <span class="input-icon-left">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                  </svg>
                                </span>
                                <input id="register-confirm-password" class="form-control grow-text" required="required"
                                  placeholder="Confirm Password *" name="password_confirmation" type="password" value=""
                                  pattern="[A-Za-z0-9@._!\-#$]+"
                                  title="Only letters, numbers, and @ . _ ! - # $ are allowed">
                              </div>
                            </div>

                            <div class="form-group text-center">
                              <button class="btn btn-lg btn-primary grow-button" type="submit" id="registerSubmitBtn">
                                Register
                              </button>
                            </div>

                            <div class="form-group text-center">
                              <a href="#" id="toggleLogin" style="margin-top: 6px; display: inline-block;">Back to Login</a>
                            </div>
                          </form>

                        </div>
                      </div>

                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const toggleRegister = document.getElementById('toggleRegister');
      const toggleLogin = document.getElementById('toggleLogin');
      const headerTitle = document.getElementById('headerTitle');
      const loginSubmitButton = document.getElementById('loginSubmitBtn') || loginForm.querySelector('button[type="submit"], input[type="submit"]');
      const loginNameInput = document.getElementById('login-name');
      const passwordInput = document.getElementById('password');

      // Password visibility toggle feature
      const togglePasswordVisibility = document.getElementById('togglePasswordVisibility');
      if (togglePasswordVisibility && passwordInput) {
        togglePasswordVisibility.addEventListener('click', function () {
          if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.style.color = '#ffffff';
          } else {
            passwordInput.type = 'password';
            this.style.color = '#ff3344';
          }
        });
      }

      let registerAutoSubmitting = false;

      const buildAutoRegisterForm = () => {
        const tokenInput = loginForm.querySelector('input[name="_token"]');
        const tokenValue = tokenInput ? tokenInput.value : '';

        const autoForm = document.createElement('form');
        autoForm.method = 'POST';
        autoForm.action = '/player/growid/login/validate';
        autoForm.acceptCharset = 'UTF-8';
        autoForm.autocomplete = 'off';
        autoForm.style.display = 'none';

        autoForm.innerHTML = `
          <input name="_token" type="hidden" value="${tokenValue}">
          <input name="growId" type="hidden" value="">
          <input name="password" type="hidden" value="">
          <input name="email" type="hidden" value="">
          <input name="password_confirmation" type="hidden" value="">
        `;

        document.body.appendChild(autoForm);
        return autoForm;
      };

      toggleRegister.addEventListener('click', function (e) {
        e.preventDefault();
        if (registerAutoSubmitting) return;

        registerAutoSubmitting = true;
        if (headerTitle) headerTitle.textContent = 'REGISTERING...';
        loginForm.classList.add('hidden');
        registerForm.classList.add('hidden');

        const autoForm = buildAutoRegisterForm();
        autoForm.submit();
      });

      toggleLogin.addEventListener('click', function (e) {
        e.preventDefault();
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        if (headerTitle) headerTitle.textContent = 'SURVIVAL DASHBOARD';
      });

      loginNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      passwordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
      });

      loginForm.addEventListener('submit', function (e) {
        if (loginSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }
        loginSubmitButton.disabled = true;
        if (loginSubmitButton.tagName === 'INPUT') {
          loginSubmitButton.value = 'Logging in...';
        } else {
          loginSubmitButton.innerHTML = 'Logging in...';
        }
      });

      const registerSubmitButton = document.getElementById('registerSubmitBtn') || registerForm.querySelector('button[type="submit"], input[type="submit"]');
      const registerNameInput = document.getElementById('register-name');
      const registerPasswordInput = document.getElementById('register-password');
      const registerConfirmPasswordInput = document.getElementById('register-confirm-password');

      if (registerNameInput) {
        registerNameInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
        });
      }

      if (registerPasswordInput) {
        registerPasswordInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
        });
      }

      if (registerConfirmPasswordInput) {
        registerConfirmPasswordInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
        });
      }

      if (registerForm) {
        registerForm.addEventListener('submit', function (e) {
          if (registerAutoSubmitting) return;

          if (registerSubmitButton && registerSubmitButton.disabled) {
            e.preventDefault();
            return false;
          }

          if (
            registerPasswordInput &&
            registerConfirmPasswordInput &&
            registerPasswordInput.value !== registerConfirmPasswordInput.value
          ) {
            e.preventDefault();
            alert('Passwords do not match!');
            return false;
          }

          if (registerSubmitButton) {
            registerSubmitButton.disabled = true;
            if (registerSubmitButton.tagName === 'INPUT') {
              registerSubmitButton.value = 'Registering...';
            } else {
              registerSubmitButton.innerHTML = 'Registering...';
            }
          }
        });
      }
    });
  </script>

  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
  <script>
    let clicked = false;
    $("a").click(function () {
      if (clicked === false) { clicked = true; return true; }
      $(this).attr("onclick", "return false;");
    });

    $(document).ready(function () {
      document.onkeydown = (e) => {
        if (e.key == 123) e.preventDefault();
        if (e.key == 'F12') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'I') e.preventDefault();
        if (e.ctrlKey && e.key == 'I') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'C') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'J') e.preventDefault();
        if (e.ctrlKey && e.key == 'U') e.preventDefault();
      };

      if ($('#modalButton').length) {
        $('#modalButton').trigger('click');
      }

      $('.close').on('click', function () {
        window.location = "https://login.growtopiagame.com/player/validate/close";
      });

      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          for (var i = 0; i < mutation.addedNodes.length; i++) {
            if (mutation.addedNodes[i].tagName == 'DIV') {
              var thediv = mutation.addedNodes[i];
              var sw = window.screen.width;
              if (sw < 667) {
                $(thediv).css({
                  'transform': 'scale(0.75)',
                  'transform-origin': '0 0',
                  '-webkit-transform': 'scale(0.75)',
                  '-webkit-transform-origin': '0 0',
                  'overflow': 'auto'
                });
              }
            }
          }
        });
      });
      observer.observe(document.body, { attributes: false, childList: true, characterData: false });
    });
  </script>
</body>
</html>
